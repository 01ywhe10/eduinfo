<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>교육과정 상세 목록 - 독립 페이지</title>
  <!-- Google Fonts & FontAwesome -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    .list-header-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-lg);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="header-top">
        <div>
          <span class="badge badge-purple"><i class="fa-solid fa-graduation-cap"></i> 직무 교육 상세 리포트</span>
          <h1 class="main-title" id="page-title" style="margin-top: 6px;">교육과정 상세 목록</h1>
          <p class="subtitle" id="page-subtitle">선택하신 교육과정의 과목명, 대분류, 세부분야, 주강사 및 후보강사 상세 정보입니다.</p>
        </div>
        
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 14px;">
          <a href="Curriculum.html" class="badge badge-purple" style="text-decoration: none; padding: 10px 16px; font-size: 0.95rem; font-weight: 600;">
            <i class="fa-solid fa-arrow-left"></i> 메인 포털로 돌아가기
          </a>
          <button class="theme-toggle-btn" id="theme-toggle-btn" onclick="toggleTheme()" style="padding: 8px 14px; font-size: 0.85rem;">
            <i class="fa-solid fa-palette"></i> 삼표 CI 테마 전환
          </button>
        </div>
      </div>
    </header>

    <div class="list-header-box">
      <div>
        <div style="font-size: 0.9rem; color: var(--text-muted);">현재 조회 조건:</div>
        <div id="filter-badge-display" style="margin-top: 6px; font-size: 1.1rem; font-weight: 700; color: var(--text-main);">
          <!-- Dynamic Badge -->
        </div>
      </div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="detail-search" placeholder="과목명, 주강사, 후보강사 실시간 검색...">
      </div>
    </div>

    <!-- Table View Section -->
    <section>
      <div class="section-title-area">
        <div class="section-title">
          <i class="fa-solid fa-table-list" style="color: var(--ci-brand-hex);"></i> 상세 교육과정 목록 및 강사 배정 현황
        </div>
        <div class="results-count" id="detail-count">총 0개 과목</div>
      </div>

      <div class="table-container">
        <table class="curriculum-table">
          <thead>
            <tr>
              <th style="width: 50px;">번호</th>
              <th style="width: 70px;">레벨</th>
              <th style="width: 140px;">대분류</th>
              <th style="width: 120px;">세부분야</th>
              <th>과목명</th>
              <th style="width: 100px;">주강사</th>
              <th style="width: 100px;">후보강사</th>
              <th style="width: 160px;">교육일자 (1차/2차)</th>
              <th style="width: 140px; text-align: center;">수료 현황 (이수/대상)</th>
            </tr>
          </thead>
          <tbody id="detail-table-body">
            <!-- Dynamic Rows -->
          </tbody>
        </table>
      </div>
    </section>

    <footer style="margin-top: 40px;">
      <p>© 2026 SAMPYO CEMENT Curriculum Portal | All Rights Reserved.</p>
    </footer>
  </div>

  <script src="js/curriculum_data.js"></script>
  <script src="js/trainee_data.js"></script>
  <script src="js/course_trainee_map.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase_config.js"></script>
  <script src="js/completion_sync.js"></script>
  <script src="js/course_status_data.js"></script>
  <script>
    const courseScheduleMap = {
      "1. Clinker 제조공정의 이해": ["2026-03-24", "2026-03-26"],
      "2. Equipment basis & trouble (1)": ["2026-03-31", "2026-04-02"],
      "1. RAW MIX CHEMISTRY 1 (기초)": ["2026-04-07", "2026-04-09"],
      "1. Flow Measurement Basic": ["2026-04-08"],
      "1. 설비유지보수 업무의 이해": ["2026-04-14", "2026-04-16"],
      "1. RAW MIX CHEMISTRY 1 (심화)": ["2026-04-15"],
      "2. Kiln System의 이해": ["2026-04-21", "2026-04-23"],
      "1. Oil 오염원 및 오염도 관리": ["2026-04-22"],
      "2. RAW MIX CHEMISTRY 2 (기초)": ["2026-04-28", "2026-04-30"],
      "2. Compressor 설비 교육 및 적용": ["2026-04-29"],
      "2. RAW MIX CHEMISTRY 2 (심화)": ["2026-05-06"],
      "3. 휘발 물질의 제어": ["2026-05-07", "2026-05-12"],
      "2. Thermodynamics & Heat Capacities": ["2026-05-13"],
      "3. RAW MIX CHEMISTRY 3 (기초)": ["2026-05-14", "2026-05-19"],
      "4. 연료의 종류 및 특성의 이해": ["2026-05-21", "2026-05-26"],
      "4. 시멘트 제조 설비의 이해": ["2026-06-02", "2026-06-04"],
      "3. Equipment basis & trouble (2)": ["2026-06-09", "2026-06-11"],
      "3. Kiln maintenance & 윤활 유지 보수": ["2026-06-10"],
      "4. RAW MIX CHEMISTRY 4 (기초)": ["2026-06-18"],
      "5. 채광공정 & 원부원료 와 시멘트 품질(기초)": ["2026-06-23", "2026-06-25"],
      "3. Fan System": ["2026-06-24"],
      "6. 원료분쇄공정과 시멘트 품질(기초)": ["2026-06-30", "2026-07-02"],
      "3. RAW MIX CHEMISTRY 3 (심화)": ["2026-07-08"],
      "5. Kiln 유지보수의 이해": ["2026-07-07", "2026-07-09"],
      "4. 휘발물질의 순환 및 CBS System 설계": ["2026-07-29"],
      "5. Gas Fundamentals & Basics": ["2026-07-14", "2026-07-16"],
      "4. 회전체 동력전달 장치 종류 및 특성": ["2026-07-22"],
      "6. NOx 생성 및 제어의 이해": ["2026-07-21", "2026-07-23"],
      "4. RAW MIX CHEMISTRY 4 (심화)": ["2026-07-15"],
      "6. Utility의 이해": ["2026-07-28", "2026-07-30"],
      "5. 채광공정 & 원부원료 와 시멘트 품질(심화)": ["2026-08-05"],
      "7. 내화물의 이해": ["2026-08-04", "2026-08-06"],
      "5. 유공압의 이해": ["2026-08-12"],
      "7. 소성공정과 시멘트 품질(기초)": ["2026-08-11", "2026-08-13"],
      "5. Heat & Gas Balance": ["2026-08-19"],
      "7. 윤활 유지보수 관리의 이해": ["2026-08-18", "2026-08-20"],
      "6. 원료분쇄공정과 시멘트 품질(심화)": ["2026-08-26"],
      "8. 분쇄 이론의 이해": ["2026-08-25", "2026-08-27"],
      "6. 열처리기술": ["2026-09-02"],
      "8. 시멘트 분쇄공정과 시멘트 품질(기초)": ["2026-09-01", "2026-09-03"],
      "6. Kiln Operation 및 Shooting Trouble": ["2026-09-09"],
      "8. 진동 관리의 이해": ["2026-09-08", "2026-09-10"],
      "7. 소성공정과 시멘트 품질(심화)": ["2026-09-16"],
      "9. 시멘트 품질과 콘크리트 품질 상관관계 (기초)": ["2026-09-15", "2026-09-17"],
      "7. Cooler 4th upgrade 설비 이해 및 유지 보수": ["2026-09-30"],
      "9. Weigh feeder 설비의 이해": ["2026-09-22", "2026-09-24"],
      "10. 고객요구품질과 대응방안 (기초)": ["2026-09-29", "2026-10-01"],
      "7. Mill Operation": ["2026-10-07"],
      "1. 환경법규와 공장환경목표(기초)": ["2026-10-06", "2026-10-08"],
      "8. 시멘트 분쇄공정과 시멘트 품질(심화)": ["2026-10-14"],
      "10. 집진 설비의 이해1": ["2026-10-13", "2026-10-15"],
      "9. 시멘트 품질과 콘크리트 품질 상관관계 (심화)": ["2026-10-21"],
      "12. 전기기초일반": ["2026-10-20", "2026-10-22"],
      "10. 고객요구품질과 대응방안 (심화)": ["2026-10-28"],
      "2. 대기환경의 이해(기초)": ["2026-10-27", "2026-10-29"],
      "3. 수질환경의 이해(기초)": ["2026-11-03", "2026-11-05"],
      "11. 집진 설비의 이해2": ["2026-11-10", "2026-11-12"],
      "13. DCS 이해 및 운영": ["2026-11-17", "2026-11-19"],
      "14. 전기기기의 종류 및 이해": ["2026-11-24", "2026-11-26"]
    };

    // Parse URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type') || 'all';

    let currentList = [];
    let titleText = '교육과정 상세 목록';
    let subtitleText = '과목별 주강사 및 후보강사 배정 상세 현황';
    let badgeHtml = '';

    if (type === 'beginner') {
      currentList = curriculumData.filter(d => d.level === '초급');
      titleText = '초급 교육과정 상세 목록';
      subtitleText = '초급 과정 (36개 과목) 과목명, 대분류, 주강사 및 후보강사 정보';
      badgeHtml = '<span class="badge badge-level-초급" style="padding: 6px 14px; font-size: 1rem;">🌿 초급 교육과정 (' + currentList.length + '개 과목)</span>';
    } else if (type === 'intermediate') {
      currentList = curriculumData.filter(d => d.level === '중급');
      titleText = '중급 교육과정 상세 목록';
      subtitleText = '중급 과정 (24개 과목) 과목명, 대분류, 주강사 및 후보강사 정보';
      badgeHtml = '<span class="badge badge-level-중급" style="padding: 6px 14px; font-size: 1rem;">🔥 중급 교육과정 (' + currentList.length + '개 과목)</span>';
    } else {
      currentList = [...curriculumData];
      titleText = '전체 등록 교육과정 상세 목록';
      subtitleText = '전체 초급/중급 (60개 과목) 과목명, 대분류, 주강사 및 후보강사 정보';
      badgeHtml = '<span class="badge badge-purple" style="padding: 6px 14px; font-size: 1rem;">📚 전체 등록 과목 (' + currentList.length + '개 과목)</span>';
    }

    document.getElementById('page-title').textContent = titleText;
    document.getElementById('page-subtitle').textContent = subtitleText;
    document.getElementById('filter-badge-display').innerHTML = badgeHtml;
    document.title = titleText + ' - 포털';

    function renderList(list) {
      const tbody = document.getElementById('detail-table-body');
      const countEl = document.getElementById('detail-count');
      tbody.innerHTML = '';
      countEl.textContent = '총 ' + list.length + '개 과목';

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding: 40px; color: var(--text-muted);">검색 조건에 해당 과목이 없습니다.</td></tr>';
        return;
      }

      list.forEach((item, index) => {
        const dates = courseScheduleMap[item.title] || [];
        let dateHtml = '-';
        if (dates.length > 0) {
          dateHtml = dates.map((d, i) => 
            `<div style="white-space: nowrap; line-height: 1.4;"><i class="fa-solid fa-calendar-day" style="margin-right: 4px; font-size: 0.78rem;"></i> ${i + 1}차: ${d}</div>`
          ).join('');
        }
        
        let statusBadge = '<span class="badge" style="background:#64748b; color:#fff;">미진행</span>';
        let completionText = '0명 / 0명';
        if (typeof getStoredCourseStatusData === 'function') {
          const statusMap = getStoredCourseStatusData();
          const st = statusMap[item.id];
          if (st) {
            if (st.status === '완료') statusBadge = '<span class="badge badge-emerald">완료</span>';
            else if (st.status === '진행중') statusBadge = '<span class="badge badge-amber">진행중</span>';
            completionText = `<strong>${st.completedCount}명</strong> / ${st.targetCount}명`;
          }
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color: var(--text-muted);">${index + 1}</td>
          <td><span class="badge badge-level-${item.level}">${item.level}</span></td>
          <td><strong>${item.category}</strong></td>
          <td>${item.subCategory}</td>
          <td style="font-weight: 700; color: var(--text-main); font-size: 0.95rem;">${item.title}</td>
          <td style="color: var(--ci-brand-light); font-weight: 700;">
            <i class="fa-solid fa-user-tie" style="margin-right: 4px;"></i> ${item.mainInstructor || '-'}
          </td>
          <td style="color: var(--accent-blue);">
            ${item.subInstructor ? '<i class="fa-solid fa-user-group" style="margin-right: 4px;"></i>' + item.subInstructor : '-'}
          </td>
          <td style="color: var(--ci-brand-light); font-weight: 600;">
            ${dateHtml}
          </td>
          <td style="text-align: center;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
              ${statusBadge}
              <span style="font-size: 0.78rem; color: var(--text-muted);">${completionText}</span>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Search filter
    document.getElementById('detail-search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      const filtered = currentList.filter(item => 
        item.title.toLowerCase().includes(q) ||
        item.mainInstructor.toLowerCase().includes(q) ||
        item.subInstructor.toLowerCase().includes(q) ||
        item.category.toLowerCase().includes(q) ||
        item.subCategory.toLowerCase().includes(q) ||
        item.note.toLowerCase().includes(q)
      );
      renderList(filtered);
    });

    function toggleTheme() {
      document.body.classList.toggle('theme-pantone');
    }

    // Initial render
    renderList(currentList);
  </script>
</body>
</html>
