<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>출석부 - 삼표시멘트 직무교육</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: "Malgun Gothic", "맑은 고딕", Arial, sans-serif;
        color: #000;
        background: #fff;
    }

    .attendance-book {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
    }

    /* 제목 */
    .title {
        text-align: center;
        font-size: 26px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    /* 강의 정보 */
    .lecture-info {
        display: grid;
        grid-template-columns: 1fr 180px;
        border: 1px solid #000;
        margin-bottom: 10px;
    }

    .lecture-name {
        padding: 10px 12px;
        font-size: 15px;
        font-weight: bold;
        line-height: 1.5;
    }

    /* 강사 확인 */
    .instructor-confirm {
        border-left: 1px solid #000;
        text-align: center;
        min-height: 75px;
    }

    .confirm-title {
        font-weight: bold;
        padding: 6px;
        border-bottom: 1px solid #000;
        background: #d9d9d9;
    }

    .confirm-sign {
        height: 48px;
        padding-top: 5px;
        line-height: 1.3;
        font-size: 13px;
    }

    /* 출석부 테이블 */
    table {
        width: 100%;
        border-collapse: collapse;
        table-layout: fixed;
    }

    th, td {
        border: 1px solid #000;
        text-align: center;
        vertical-align: middle;
        padding: 8px 10px;
    }

    th {
        background: #d9d9d9;
        font-weight: bold;
        font-size: 14.5px;
        line-height: 1.4;
    }

    .no-col {
        width: 8%;
    }

    .time-sub-header {
        background: #d9d9d9;
        font-weight: bold;
        height: 32px;
        font-size: 14.5px;
    }

    .time-header {
        background: #d9d9d9;
        font-weight: bold;
        height: 32px;
        font-size: 14.5px;
    }

    .remark-col {
        width: 32%;
    }

    /* 예시 행 */
    .example-row {
        height: 56px;
        font-size: 12.5px;
        line-height: 1.4;
        color: #777;
    }

    /* 데이터 행: 가독성 및 수기 서명 여백 확보를 위해 높이 42px 지정 */
    .data-row {
        height: 42px;
        font-size: 14px;
        line-height: 1.5;
    }

    .name-cell {
        color: #222;
        font-weight: bold;
        background-color: #fff;
        font-size: 14px;
    }

    .signature-cell {
        background-color: #fff;
    }

    .remark-cell {
        font-size: 13px;
        background-color: #fff;
    }

    .footer-note {
        margin-top: 16px;
        font-size: 13px;
        font-weight: 600;
        color: #444;
    }

    .no-print {
        margin-top: 24px;
        text-align: center;
    }

    /* 인쇄 설정 */
    @media print {
        @page {
            size: A4 portrait;
            margin: 10mm;
        }

        body {
            padding: 0;
        }

        .attendance-book {
            max-width: none;
        }

        .title {
            font-size: 24px;
            margin-bottom: 14px;
        }

        .lecture-info {
            margin-bottom: 8px;
        }

        .data-row {
            height: 38px;
        }

        .footer-note {
            display: none;
        }

        .no-print {
            display: none !important;
        }
    }
</style>
</head>

<body>

<div class="attendance-book">

    <!-- 제목 -->
    <div class="title" id="attendance-main-title">
        출 석 부
    </div>

    <!-- 강의 정보 -->
    <div class="lecture-info">
        <div class="lecture-name" id="lecture-info-title">
            ○ 강의명 : 유지보수 6. Utility의 이해<br>
            ○ 교육일자 : 2026년 8월 11일<br>
            ○ 담당강사 : 주강사 미정
        </div>

        <div class="instructor-confirm">
            <div class="confirm-title">
                강사확인
            </div>
            <div class="confirm-sign">
                서명<br>
                (이름을 정자로 작성)
            </div>
        </div>
    </div>

    <!-- 출석부 테이블 -->
    <table>
        <colgroup>
            <col class="no-col">
            <col style="width: 30%;">
            <col style="width: 30%;">
            <col class="remark-col">
        </colgroup>

        <thead>
            <!-- 날짜 헤더 -->
            <tr>
                <th rowspan="3" class="no-col">
                    No.
                </th>

                <th colspan="2" id="attendance-date-header">
                    07월 22일
                </th>

                <th rowspan="3" class="remark-col">
                    비고
                </th>
            </tr>

            <!-- 시작 / 종료 헤더 -->
            <tr>
                <th class="time-sub-header">시작</th>
                <th class="time-sub-header">종료</th>
            </tr>

            <!-- 시간 헤더 -->
            <tr>
                <th class="time-header" id="start-time-header">11:00</th>
                <th class="time-header" id="end-time-header">12:00</th>
            </tr>
        </thead>

        <tbody id="attendance-tbody">
            <!-- 예시 행 -->
            <tr class="example-row">
                <td>(예시)</td>
                <td>
                    서명<br>
                    (이름을 정자로 작성)
                </td>
                <td>
                    서명<br>
                    (이름을 정자로 작성)
                </td>
                <td>
                    결석 / 지각 / 조퇴<br>
                    (강사가 작성)
                </td>
            </tr>
        </tbody>
    </table>

    <!-- 하단 안내 -->
    <div class="footer-note" id="footer-note-text">
        ※ 출석 시 본인이 서명란(시작/종료)에 이름을 정자로 작성합니다.
    </div>

    <div class="no-print">
        <button onclick="window.print()" style="padding: 10px 24px; background: #009ade; color: white; border: none; font-size: 15px; font-weight: bold; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 12px rgba(0,154,222,0.3);">
            🖨️ 출석부 인쇄하기
        </button>
    </div>

</div>

<!-- Data Scripts for Dynamic Population -->
<script src="js/curriculum_data.js"></script>
<script src="js/trainee_data.js"></script>
<script src="js/course_trainee_map.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase_config.js"></script>
  <script src="js/completion_sync.js"></script>
<script src="js/course_status_data.js"></script>

<script>
  const defaultCourseScheduleMap = {

    "9. 시멘트 품질과 콘크리트 품질 상관관계 (기초)": ["2026-09-15", "2026-09-17"],
    "7. Cooler 4th upgrade 설비 이해 및 유지 보수": ["2026-09-30"],
    "9. Weigh feeder 설비의 이해": ["2026-09-22", "2026-09-24"],
    "10. 고객요구품질과 대응방안 (기초)": ["2026-09-29", "2026-10-01"],
    "7. Mill Operation": ["2026-10-07"],
    "1. 환경법규와 공장환경목표(기초)": ["2026-10-06", "2026-10-08"],
    "8. 시멘트 분쇄공정과 시멘트 품질(심화)": ["2026-10-14"],
    "10. 집진 설비의 이해1": ["2026-10-13", "2026-10-15"],
    "9. 시멘트 품질과 콘크리트 품질 상관관계 (심화)": ["2026-10-21"],
    "12. 전기기초일반": ["2026-10-20", "2026-10-22"],
    "10. 고객요구품질과 대응방안 (심화)": ["2026-10-28"],
    "2. 대기환경의 이해(기초)": ["2026-10-27", "2026-10-29"],
    "3. 수질환경의 이해(기초)": ["2026-11-03", "2026-11-05"],
    "11. 집진 설비의 이해2": ["2026-11-10", "2026-11-12"],
    "13. DCS 이해 및 운영": ["2026-11-17", "2026-11-19"],
    "14. 전기기기의 종류 및 이해": ["2026-11-24", "2026-11-26"]
  };
  let courseScheduleMap = { ...defaultCourseScheduleMap };

  async function loadScheduleFromCSV() {
    try {
      const response = await fetch('교육일자.csv');
      if (!response.ok) return;
      const text = await response.text();
      const lines = text.split('\n').filter(l => l.trim());
      if (lines.length <= 1) return;

      const scheduleMap = {};
      // Skip header line
      for (let i = 1; i < lines.length; i++) {
        const parts = lines[i].split(',').map(p => p.trim());
        if (parts.length >= 4) {
          const dateStr = parts[0]; // e.g. "7/28"
          const title = parts[3];   // e.g. "6. Utility의 이해"
          
          if (!dateStr || !title) continue;

          let formattedDate = dateStr;
          if (dateStr.includes('/')) {
            const [m, d] = dateStr.split('/');
            const month = m.padStart(2, '0');
            const day = d.padStart(2, '0');
            formattedDate = `2026-${month}-${day}`;
          } else if (dateStr.includes('-')) {
            const [m, d] = dateStr.split('-');
            const month = m.padStart(2, '0');
            const day = d.padStart(2, '0');
            formattedDate = `2026-${month}-${day}`;
          }

          if (!scheduleMap[title]) {
            scheduleMap[title] = [];
          }
          scheduleMap[title].push(formattedDate);
        }
      }

      if (Object.keys(scheduleMap).length > 0) {
        courseScheduleMap = scheduleMap;
      }
    } catch (e) {
      console.warn('Failed to load 교육일자.csv, using default schedule map.', e);
    }
  }

  // Helper to read 1차 completed trainees from Admin localStorage
  function getRound1CompletedSet(courseId) {
    try {
      const saved = localStorage.getItem('sampyo_admin_course_status_v3');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (parsed[courseId] && Array.isArray(parsed[courseId].round1Trainees)) {
          return new Set(parsed[courseId].round1Trainees);
        }
      }
    } catch (e) {}
    return new Set();
  }

  window.addEventListener('DOMContentLoaded', async () => {
    await loadScheduleFromCSV();

    const params = new URLSearchParams(window.location.search);
    const courseId = params.get('courseId');
    const roundParam = params.get('round') || '1'; // '1' or '2'

    if (!courseId || typeof curriculumData === 'undefined') return;

    const item = curriculumData.find(d => d.id === courseId);
    if (!item) return;

    const dateList = courseScheduleMap[item.title] || [];
    const rawDate = (roundParam === '2') ? (dateList[1] || dateList[0] || '') : (dateList[0] || '');

    function formatFullDate(dStr) {
      if (!dStr || !dStr.includes('-')) return dStr || '일정 미정';
      const parts = dStr.split('-');
      return `${parts[0]}년 ${parseInt(parts[1], 10)}월 ${parseInt(parts[2], 10)}일`;
    }

    function formatShortDate(dStr) {
      if (!dStr || !dStr.includes('-')) return dStr || '일정 미정';
      const parts = dStr.split('-');
      return `${parts[1]}월 ${parts[2]}일`;
    }

    const fullDateText = formatFullDate(rawDate);
    const shortDateText = formatShortDate(rawDate);

    document.title = `출석부(${roundParam}차) - ${item.title}`;

    const titleEl = document.getElementById('attendance-main-title');
    if (titleEl) {
      titleEl.textContent = `출 석 부 (${roundParam}차)`;
    }

    // 1. Lecture Info Header
    const lectureTitleEl = document.getElementById('lecture-info-title');
    if (lectureTitleEl) {
      lectureTitleEl.innerHTML = `
        ○ 강의명 : ${item.title} (${item.level} 과정 - ${roundParam}차)<br>
        ○ 교육일자 : ${fullDateText}<br>
        ○ 담당강사 : 주강사 ${item.mainInstructor || '미정'} ${item.subInstructor ? '/ 후보강사 ' + item.subInstructor : ''}
      `;
    }

    // 2. Date Header (Specific to selected round)
    const dateHeaderEl = document.getElementById('attendance-date-header');
    if (dateHeaderEl) {
      dateHeaderEl.textContent = `${shortDateText} (${roundParam}차)`;
    }

    // 3. Trainees Table Body
    const tbodyEl = document.getElementById('attendance-tbody');
    if (tbodyEl) {
      let rawTrainees = (typeof courseTraineeMap !== 'undefined' && courseTraineeMap[courseId]) ? courseTraineeMap[courseId] : [];
      
      // If round 2 is selected, EXCLUDE trainees who completed round 1 in Admin portal!
      if (roundParam === '2') {
        const completedR1Set = getRound1CompletedSet(courseId);
        rawTrainees = rawTrainees.filter(t => !completedR1Set.has(t.empId));
      }

      const totalRows = Math.max(25, rawTrainees.length + 5);

      let html = `
        <tr class="example-row">
          <td>(예시)</td>
          <td>
            서명<br>
            (이름을 정자로 작성)
          </td>
          <td>
            서명<br>
            (이름을 정자로 작성)
          </td>
          <td>
            결석 / 지각 / 조퇴<br>
            (강사가 작성)
          </td>
        </tr>
      `;

      for (let i = 0; i < totalRows; i++) {
        const t = rawTrainees[i];
        const name = t ? t.name : '';
        html += `
          <tr class="data-row">
            <td>${i + 1}</td>
            <td class="name-cell">${name}</td>
            <td class="signature-cell"></td>
            <td class="remark-cell"></td>
          </tr>
        `;
      }

      tbodyEl.innerHTML = html;
    }

    const noteEl = document.getElementById('footer-note-text');
    if (noteEl && roundParam === '2') {
      noteEl.textContent = `※ 1차 교육 이수자는 명단에서 자동 제외되었으며, 출석 시 본인이 서명란(시작/종료)에 이름을 정자로 작성합니다.`;
    }

    // Auto print if requested
    if (params.get('autoprint') === '1' || params.get('print') === 'true') {
      setTimeout(() => {
        window.print();
      }, 300);
    }
  });
</script>

</body>
</html>
